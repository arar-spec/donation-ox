const QUIZ_COUNT=5;
function chooseQuestions(){let pool=cfg.questions.slice();for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}quizQuestions=pool.slice(0,Math.min(QUIZ_COUNT,pool.length));}
function apply(){document.getElementById('brand').textContent=cfg.brand;document.getElementById('tag').textContent=cfg.tag;document.getElementById('title').textContent=cfg.title;document.getElementById('intro').textContent=cfg.intro;document.getElementById('intro').style.whiteSpace='pre-line';document.title=cfg.title;document.getElementById('resultLogo').src=document.getElementById('uniLogo').src;}
function render(){let q=quizQuestions[index];document.getElementById('counter').textContent=`문제 ${index+1} / ${quizQuestions.length}`;document.getElementById('fill').style.width=`${index/quizQuestions.length*100}%`;document.getElementById('question').textContent=q.q;document.getElementById('feedback').classList.add('hidden');document.getElementById('next').disabled=true;document.getElementById('next').textContent=index===quizQuestions.length-1?'결과 확인 →':'다음 문제 →';for(let id of ['o','x']){let b=document.getElementById(id);b.disabled=false;b.classList.remove('selected');}selected=null;}
function answer(a){if(selected!==null)return;selected=a;let q=quizQuestions[index];let ok=a===q.a;if(ok)correct++;document.getElementById(a.toLowerCase()).classList.add('selected');for(let id of ['o','x'])document.getElementById(id).disabled=true;let fb=document.getElementById('feedback');fb.classList.remove('hidden');fb.innerHTML='';let bold=document.createElement('b');bold.textContent=ok?'🎉 정답입니다!':`💡 아쉬워요! 정답은 ${q.a}입니다.`;fb.append(bold,document.createTextNode(q.e));document.getElementById('next').disabled=false;document.getElementById('fill').style.width=`${(index+1)/quizQuestions.length*100}%`;}
function nextQuestion(){if(selected===null)return;if(index+1<quizQuestions.length){index++;render();}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${correct} / ${quizQuestions.length}`;document.getElementById('resultText').textContent=cfg.result;document.getElementById('resultText').style.whiteSpace='pre-line';}}
function restart(){index=0;correct=0;selected=null;chooseQuestions();document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0);}
async function saveResult(){let c=document.createElement('canvas');c.width=1080;c.height=1350;let x=c.getContext('2d');x.fillStyle='#063a61';x.fillRect(0,0,1080,1350);x.fillStyle='#fff';round(x,70,80,940,1180,36);x.fill();x.textAlign='center';x.fillStyle='#08719b';x.font='bold 32px sans-serif';x.fillText(cfg.brand,540,245,880);x.fillStyle='#123047';x.font='bold 66px sans-serif';x.fillText(cfg.title,540,370,870);x.fillStyle='#075d83';x.font='bold 120px sans-serif';x.fillText(`${correct} / ${quizQuestions.length}`,540,570);x.font='bold 34px sans-serif';x.fillStyle='#58717d';x.fillText('나의 OX 퀴즈 결과',540,640);x.fillStyle='#eef8fb';round(x,135,725,810,290,25);x.fill();x.fillStyle='#123047';x.font='bold 31px sans-serif';let lines=wrapText(x,cfg.result.replace(/\n/g,' '),735);lines.slice(0,5).forEach((s,i)=>x.fillText(s,540,810+i*50));x.fillStyle='#7a8d96';x.font='26px sans-serif';x.fillText('※ 발전기금 홍보를 위한 참여형 퀴즈입니다.',540,1165);try{const img=document.getElementById('uniLogo');await img.decode();x.drawImage(img,470,104,140,140);}catch(e){}let a=document.createElement('a');a.download='발전기금_OX퀴즈_결과.png';a.href=c.toDataURL('image/png');a.click();}
function wrapText(ctx,t,max){let words=t.split(' '),out=[],s='';for(let w of words){let v=s?s+' '+w:w;if(ctx.measureText(v).width>max&&s){out.push(s);s=w;}else s=v;}if(s)out.push(s);return out;}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function init(){if(!Array.isArray(cfg.questions)||!cfg.questions.length)cfg.questions=defaults.questions;apply();chooseQuestions();render();}init();
</script></body></html>
